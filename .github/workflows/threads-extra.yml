name: threads-extra

on:
  workflow_dispatch:
    inputs:
      force:
        description: "하루 1회 가드 무시 (테스트용)"
        type: boolean
        default: false
      slot:
        description: "morning | evening"
        required: false
        default: ""  # 비우면 KST 시각으로 자동 판정 (cron-job.org 트리거용)

permissions:
  contents: write

concurrency:
  group: threads-extra
  cancel-in-progress: false

jobs:
  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Decide slot
        id: slot
        run: |
          # KST 기준 판정 — GitHub cron이 몇 시간 지연돼도 슬롯이 안 바뀌게.
          # (UTC 시각으로 판정하면 지연된 아침 cron이 evening으로 오분류됨: 2026-08-04 실사고)
          H=$(TZ=Asia/Seoul date +%H)
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            S="${{ github.event.inputs.slot }}"
          elif [ "$H" -ge 5 ] && [ "$H" -lt 15 ]; then
            S=morning
          else
            S=evening
          fi
          echo "s=$S" >> "$GITHUB_OUTPUT"
          echo "slot=$S (KST hour=$H)"

      - name: Judge extra post
        continue-on-error: true
        env:
          THREADS_TOKEN_JUDGE: ${{ secrets.THREADS_TOKEN_JUDGE }}
          THREADS_USER_ID_JUDGE: ${{ secrets.THREADS_USER_ID_JUDGE }}
        run: python post_threads.py --pool judge ${{ steps.slot.outputs.s }} ${{ inputs.force == true && '--force' || '' }}

      - name: Lab extra post
        # 🛑 잘잘못연구소 운영 중단 (2026-08-12) — 되살리려면 if: false 제거
        if: false
        continue-on-error: true
        env:
          THREADS_TOKEN_LAB: ${{ secrets.THREADS_TOKEN_LAB }}
          THREADS_USER_ID_LAB: ${{ secrets.THREADS_USER_ID_LAB }}
        run: python post_threads.py --pool lab ${{ steps.slot.outputs.s }} ${{ inputs.force == true && '--force' || '' }}

      - name: Commit pool state
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add threads_pool_*.json
          git diff --cached --quiet || git commit -m "threads pool: advance [skip ci]"
          git pull --rebase origin main
          git push
