name: publish-cardnews

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # 🛑 댓글판사 운영 중단 (2026-08-21 사장님 결정) — 되살리려면 이 조건 삭제
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Claim today's slot (race guard)
        id: claim
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main
          R=$(python claim.py state.json)
          if [ "$R" = "CLAIMED" ]; then
            git add state.json
            git commit -m "claim slot [skip ci]"
            if ! git push; then
              git fetch origin
              git reset --hard origin/main
              R=$(python claim.py state.json)
              if [ "$R" = "CLAIMED" ]; then
                git add state.json && git commit -m "claim slot retry [skip ci]" && git push || R=SKIP
              fi
            fi
          fi
          echo "result=$R"
          echo "r=$R" >> "$GITHUB_OUTPUT"

      - name: Publish next case to Instagram
        if: steps.claim.outputs.r == 'CLAIMED'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python upload_instagram.py

      - name: Cross-post to Threads
        # 🔁 같은 사연이 하루 3번(캐러셀·릴스·스레드) 반복되던 구조 정리 (2026-08-12)
        #    스레드는 pool 아침·저녁 2편으로 충분. 되살리려면 if: false 제거
        if: false
        continue-on-error: true
        env:
          THREADS_TOKEN_JUDGE: ${{ secrets.THREADS_TOKEN_JUDGE }}
          THREADS_USER_ID_JUDGE: ${{ secrets.THREADS_USER_ID_JUDGE }}
        run: python post_threads.py "$(cat last_slug.txt)"


      - name: Rollback claim on failure (재시도 가능하게)
        if: failure() && steps.claim.outputs.r == 'CLAIMED'
        run: |
          R=$(python unclaim.py state.json)
          echo "rollback: $R"
          if [ "$R" = "UNCLAIMED" ]; then
            git config user.name "cardnews-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "rollback claim (발행 실패) [skip ci]" || true
            git pull --rebase origin main && git push || true
          fi

      - name: Commit state
        if: steps.claim.outputs.r == 'CLAIMED'
        run: |
          rm -f last_slug.txt
          git add state.json
          git diff --cached --quiet || git commit -m "state: advance next_case [skip ci]"
          git pull --rebase origin main
          git push
