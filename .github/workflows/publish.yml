name: publish-cardnews

on:
  schedule:
    # 11:00~13:40 KST 사이 20분 간격 다중 트리거 — GitHub cron 지연 대응.
    # 하루 1회 발행은 스크립트의 last_published 가드가 보장.
    - cron: "0,20,40 2-4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publish next case to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python upload_instagram.py

      - name: Commit state
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: advance next_case [skip ci]"
          git pull --rebase origin main
          git push
