name: publish-lab

on:
  schedule:
    - cron: "0 10 * * *"   # 19:00 KST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-lab
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publish next lab case to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_LAB }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_LAB }}
        run: python upload_instagram.py state-lab.json

      - name: Commit state
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state-lab.json
          git diff --cached --quiet || git commit -m "state-lab: advance next_case [skip ci]"
          git pull --rebase origin main
          git push
