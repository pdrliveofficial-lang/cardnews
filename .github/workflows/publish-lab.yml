name: publish-lab

on:
  schedule:
    # 19:00~21:40 KST 사이 20분 간격 다중 트리거 — GitHub cron 지연 대응.
    # 하루 1회 발행은 선점(claim) 커밋 + last_published 가드가 보장.
    - cron: "0,20,40 10-12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-lab
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Claim today's slot (race guard)
        id: claim
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main
          R=$(python claim.py state-lab.json)
          if [ "$R" = "CLAIMED" ]; then
            git add state-lab.json
            git commit -m "claim lab slot [skip ci]"
            if ! git push; then
              git fetch origin
              git reset --hard origin/main
              R=$(python claim.py state-lab.json)
              if [ "$R" = "CLAIMED" ]; then
                git add state-lab.json && git commit -m "claim lab slot retry [skip ci]" && git push || R=SKIP
              fi
            fi
          fi
          echo "result=$R"
          echo "r=$R" >> "$GITHUB_OUTPUT"

      - name: Publish next lab case to Instagram
        if: steps.claim.outputs.r == 'CLAIMED'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_LAB }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_LAB }}
        run: python upload_instagram.py state-lab.json

      - name: Commit state
        if: steps.claim.outputs.r == 'CLAIMED'
        run: |
          git add state-lab.json
          git diff --cached --quiet || git commit -m "state-lab: advance next_case [skip ci]"
          git pull --rebase origin main
          git push
