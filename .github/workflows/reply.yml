name: reply-bot

on:
  workflow_dispatch:
    inputs:
      only:
        description: "특정 계정만 (judge | lab), 비우면 둘 다"
        required: false
        default: ""
      audit:
        description: "감사만 — 미답변 건수만 세고 답글 안 담"
        type: boolean
        default: false
      cap:
        description: "이번 실행 답글 상한 (기본 25, 밀린 물량 소화 시 크게)"
        required: false
        default: "25"
      threads:
        description: "훑을 원글 개수 (기본 8)"
        required: false
        default: "8"
      days:
        description: "최근 N일 원글만 대상 (기본 3, 0이면 전체) — API 한도를 살아있는 글에 집중"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: reply-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Reply — judge
        # 🛑 댓글판사 운영 중단 (2026-08-21 사장님 결정) — 되살리려면 if: false 제거
        if: false
        continue-on-error: true
        env:
          THREADS_TOKEN_JUDGE: ${{ secrets.THREADS_TOKEN_JUDGE }}
          THREADS_USER_ID_JUDGE: ${{ secrets.THREADS_USER_ID_JUDGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python reply_bot.py judge \
            ${{ inputs.audit == true && '--audit' || '' }} \
            --cap=${{ inputs.cap || 15 }} --threads=${{ inputs.threads || 8 }} \
            --days=${{ inputs.days || 3 }}

      - name: Reply — lab
        # 🛑 잘잘못연구소 운영 중단 (2026-08-12) — 되살리려면 if: false 제거
        if: false
        if: inputs.only != 'judge'
        continue-on-error: true
        env:
          THREADS_TOKEN_LAB: ${{ secrets.THREADS_TOKEN_LAB }}
          THREADS_USER_ID_LAB: ${{ secrets.THREADS_USER_ID_LAB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python reply_bot.py lab \
            ${{ inputs.audit == true && '--audit' || '' }} \
            --cap=${{ inputs.cap || 15 }} --threads=${{ inputs.threads || 8 }} \
            --days=${{ inputs.days || 3 }}

      - name: Commit replied state
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add replied_*.json
          git diff --cached --quiet || git commit -m "reply: update replied ids [skip ci]"
          git pull --rebase origin main
          git push
