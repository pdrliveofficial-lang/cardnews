name: stats

on:
  schedule:
    # 매일 KST 02:00(17:00 UTC) — 그날 나간 글이 모두 12h 이상 익은 시점
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Snapshot threads stats
        env:
          THREADS_TOKEN_JUDGE: ${{ secrets.THREADS_TOKEN_JUDGE }}
          THREADS_USER_ID_JUDGE: ${{ secrets.THREADS_USER_ID_JUDGE }}
          THREADS_TOKEN_LAB: ${{ secrets.THREADS_TOKEN_LAB }}
          THREADS_USER_ID_LAB: ${{ secrets.THREADS_USER_ID_LAB }}
        run: python threads_insights.py --save
      - name: Commit
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || git commit -m "stats: threads snapshot [skip ci]"
          git pull --rebase origin main
          git push
