<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>jaljalmot lab render</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 잘잘못연구소 디자인 시스템 — design_handoff_jaljalmot_cardnews 스펙 그대로 */
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ width:1080px; height:1350px; overflow:hidden;
        font-family:'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif; }

  .card{ width:1080px; height:1350px; background:#5C4BC4; color:#FFFFFF;
         display:flex; flex-direction:column; padding:72px 68px; overflow:hidden; }

  .progress{ display:flex; gap:10px; }
  .progress div{ flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,0.35); }
  .progress div.on{ background:#FFFFFF; }

  .profile{ display:flex; align-items:center; gap:20px; margin-top:36px; }
  .avatar{ width:76px; height:76px; border-radius:50%; background:#FFFFFF; color:#5C4BC4;
           display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:900; }
  .handle{ font-size:32px; font-weight:800; }
  .meta{ font-size:26px; opacity:0.7; }

  .chip{ background:rgba(255,255,255,0.14); border-radius:32px; padding:20px 40px;
         align-self:center; font-size:30px; font-weight:700; }

  .wcard{ background:#FFFFFF; color:#26213F; border-radius:32px; padding:64px 60px;
          box-shadow:0 16px 40px rgba(0,0,0,0.22); }
  .wcard .txt{ font-size:52px; font-weight:700; line-height:1.6; word-break:keep-all; }
  .wcard.q .txt{ font-size:50px; font-weight:800; line-height:1.5; }
  .wcard .cap{ font-size:25px; color:#8D87A6; margin-top:24px; font-weight:600; }
  .rotL{ transform:rotate(-1deg); } .rotR{ transform:rotate(1deg); }
  .rotLL{ transform:rotate(-1.5deg); } .rotRR{ transform:rotate(1.5deg); }

  .txt b, .txt strong{ background:#EEE9FF; color:#5C4BC4; padding:0 12px; border-radius:8px; font-weight:inherit; }
  .txt em{ font-style:normal; color:#5C4BC4; font-weight:800; }

  .stack{ display:flex; flex-direction:column; gap:44px; margin-top:72px; }
  .nudge{ margin-top:auto; text-align:center; font-size:28px; opacity:0.8; }

  .replybar{ margin-top:auto; display:flex; align-items:center; gap:24px;
             background:rgba(255,255,255,0.14); border-radius:999px; padding:24px 44px; }
  .replybar .t{ font-size:28px; opacity:0.85; }
  .replybar .r{ margin-left:auto; font-size:32px; }
  .replybar .send{ margin-left:auto; font-size:30px; font-weight:900; opacity:1; }

  /* 표지 */
  .cover-chip{ margin-top:100px; letter-spacing:0.1em; padding:24px 44px; }
  .cover-emoji{ text-align:center; font-size:60px; margin-top:40px; }
  .cover-title{ text-align:center; font-size:96px; font-weight:900; line-height:1.32;
                letter-spacing:-0.03em; margin-top:28px; word-break:keep-all; }
  .cover-title em{ font-style:normal; background:#FFFFFF; color:#5C4BC4; padding:0 20px; border-radius:16px; }
  .cta{ align-self:center; background:#FFFFFF; color:#5C4BC4; font-size:34px; font-weight:900;
        padding:26px 56px; border-radius:999px; margin-top:80px; box-shadow:0 12px 32px rgba(0,0,0,0.25); }
  .cover-foot{ margin-top:auto; text-align:center; font-size:26px; opacity:0.75; }

  /* VS */
  .vswrap{ display:flex; flex-direction:column; gap:52px; margin-top:72px; position:relative; }
  .pill{ display:inline-block; font-size:26px; font-weight:900; padding:8px 24px; border-radius:999px; color:#fff; }
  .pill.a{ background:#5C4BC4; } .pill.b{ background:#26213F; }
  .vs-q{ font-size:46px; font-weight:800; line-height:1.5; margin-top:28px; word-break:keep-all; }
  .vsbadge{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            background:#FFFFFF; color:#5C4BC4; font-size:40px; font-weight:900; width:110px; height:110px;
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            box-shadow:0 12px 32px rgba(0,0,0,0.3); }

  /* 투표 */
  .vq{ text-align:center; font-size:100px; font-weight:900; letter-spacing:-0.03em; line-height:1.3; margin-top:110px; word-break:keep-all; }
  .votecard{ background:#FFFFFF; border-radius:28px; overflow:hidden; margin-top:80px; box-shadow:0 16px 40px rgba(0,0,0,0.22); display:flex; }
  .opt{ flex:1; padding:56px 32px; text-align:center; }
  .opt .letter{ font-size:56px; font-weight:900; color:#5C4BC4; }
  .opt .label{ font-size:34px; font-weight:800; line-height:1.45; margin-top:16px; color:#26213F; word-break:keep-all; }
  .divider{ width:3px; background:#EEE9FF; }
  .pin{ text-align:center; font-size:26px; opacity:0.8; margin-top:28px; }
</style>
</head>
<body>
<div id="root"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
  const story = JSON.parse(document.getElementById('data').textContent.replace('/*__DATA__*/',''));
  const idx = parseInt(new URLSearchParams(location.search).get('card') || '0', 10);
  const c = story.cards[idx];
  const total = story.cards.length;
  const handle = story.handle || 'jaljalmot_lab';

  const progress = '<div class="progress">' +
    Array.from({length: total}, (_, i) => `<div class="${i <= idx ? 'on' : ''}"></div>`).join('') + '</div>';
  const metaText = idx === 0 ? `연구 NO.${story.case_no}`
                 : idx === total - 1 ? `${idx + 1} / ${total} · 최종`
                 : `${idx + 1} / ${total}`;
  const profile = `<div class="profile"><div class="avatar">잘</div><span class="handle">${handle}</span>` +
                  `<span class="meta">${metaText}</span></div>`;
  const shell = progress + profile;

  // 카드 위치별 챕터 칩 이모지 & 하단 넘김 문구
  const chipEmoji = ['🔍','🎁','🥕','🚨','😥','⚖️',''];
  const nudges = ['', '…그런데 말입니다 →', '문제의 발언은? →', '', '양쪽 입장 정리 →', '당신의 판결은? →', ''];

  let html = '';
  if (c.type === 'cover') {
    html = `<div class="card">${shell}
      <div class="chip cover-chip">🔍 ${c.tag || '오늘의 연구'}</div>
      ${c.emoji ? `<div class="cover-emoji">${c.emoji}</div>` : ''}
      <div class="cover-title">${c.title}</div>
      <div class="cta">${story.swipe_text || '결론 내리러 넘기기 →'}</div>
      <div class="cover-foot">위로 넘겨서 전체 사연 보기</div></div>`;
  } else if (c.type === 'story') {
    const cards = c.paras.map((p, i) =>
      `<div class="wcard ${i % 2 === 0 ? 'rotL' : 'rotR'}"><div class="txt">${p}</div></div>`).join('');
    html = `<div class="card">${shell}
      <div class="chip" style="margin-top:110px">${chipEmoji[idx]} ${c.label}</div>
      <div class="stack">${cards}</div>
      <div class="nudge">${nudges[idx] || '다음 장으로 →'}</div></div>`;
  } else if (c.type === 'quote') {
    const caps = ['😅', '🤷'];
    const cards = c.quotes.map((q, i) =>
      `<div class="wcard q ${i % 2 === 0 ? 'rotLL' : 'rotRR'}"><div class="txt">${q}</div>
       <div class="cap">${c.label} ${'①②③'[i] || ''} ${caps[i] || ''}</div></div>`).join('');
    html = `<div class="card">${shell}
      <div class="chip" style="margin-top:80px">${chipEmoji[idx]} ${c.label}</div>
      <div class="stack" style="margin-top:64px">${cards}</div>
      <div class="replybar"><span class="t">이 말, 어떻게 생각하세요?</span><span class="r">💬</span></div></div>`;
  } else if (c.type === 'vs') {
    html = `<div class="card">${shell}
      <div class="chip" style="margin-top:90px">${chipEmoji[idx]} ${c.label}</div>
      <div class="vswrap">
        <div class="wcard rotL"><span class="pill a">A · ${c.a.who}</span><div class="txt vs-q">${c.a.text}</div></div>
        <div class="wcard rotR"><span class="pill b">B · ${c.b.who}</span><div class="txt vs-q">${c.b.text}</div></div>
        <div class="vsbadge">VS</div>
      </div>
      <div class="nudge">${nudges[idx]}</div></div>`;
  } else if (c.type === 'verdict') {
    const title = c.title.replace(/<\/?em>/g, '');
    html = `<div class="card">${shell}
      <div class="vq">${title} 🤔</div>
      <div class="votecard">
        <div class="opt"><div class="letter">A</div><div class="label">${c.a}</div></div>
        <div class="divider"></div>
        <div class="opt"><div class="letter">B</div><div class="label">${c.b}</div></div>
      </div>
      <div class="replybar"><span class="t">댓글로 결론 남기기…</span><span class="send">보내기</span></div>
      <div class="pin">가장 공감받은 결론은 댓글 고정 📌</div></div>`;
  }
  document.getElementById('root').innerHTML = html;

  // 내용이 카드 높이를 넘치면 본문 글자를 단계적으로 줄인다
  const overflows = () => {
    const limit = 1350 - 60;
    return [...document.querySelectorAll('.card *')].some(el => el.getBoundingClientRect().bottom > limit);
  };
  let guard = 0;
  while (overflows() && guard++ < 14) {
    document.querySelectorAll('.wcard .txt, .cover-title, .vq, .opt .label').forEach(el => {
      const fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = (fs * 0.94) + 'px';
    });
  }
</script>
</body>
</html>
